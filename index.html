<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Don't Wake It</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #111722;
      color: #f1eee7;
      font-family: sans-serif;
    }

    main {
      width: min(1260px, 96vw);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 960px) 260px;
      align-items: start;
      gap: 16px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #344047;
      border: 2px solid #7c8992;
      touch-action: none;
    }

    .info-sidebar {
      padding: 16px;
      border: 1px solid #465361;
      border-radius: 8px;
      background: #18212c;
    }

    .info-sidebar h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .stats {
      display: grid;
      gap: 10px;
      margin: 0;
    }

    .stats div {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid #303c48;
    }

    .stats dt {
      color: #bdc7cf;
      font-size: 13px;
    }

    .stats dd {
      margin: 0;
      font-size: 14px;
      font-weight: bold;
      text-align: right;
    }

    #hud-timer {
      color: #f2c977;
      font-size: 18px;
    }

    .sidebar-message {
      min-height: 48px;
      margin: 14px 0 4px;
      color: #f2c977;
      font-size: 13px;
      line-height: 1.4;
    }

    .sidebar-prompt {
      min-height: 18px;
      color: #9ed1ad;
      font-size: 12px;
    }

    .controls-info {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #465361;
    }

    .controls-info p {
      margin: 6px 0;
      color: #bdc7cf;
      font-size: 13px;
      line-height: 1.4;
    }

    .touch-controls {
      display: none;
    }

    @media (max-width: 1050px) {
      body {
        display: block;
        padding: 12px;
      }

      main {
        width: min(960px, 100%);
        margin: 0 auto;
      }

      .game-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .info-sidebar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .controls-info {
        margin: 0;
        padding: 0 0 0 16px;
        border-top: 0;
        border-left: 1px solid #465361;
      }
    }

    @media (pointer: coarse), (max-width: 800px) {
      .touch-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        width: 100%;
        max-width: 560px;
        margin: 14px auto 0;
        padding: 12px;
        border: 1px solid #3c4854;
        border-radius: 14px;
        background: #18212c;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .direction-pad {
        display: grid;
        grid-template-columns: repeat(3, 54px);
        grid-template-rows: repeat(2, 48px);
        gap: 5px;
      }

      .direction-pad [data-game-key="arrowup"] {
        grid-column: 2;
      }

      .direction-pad [data-game-key="arrowleft"] {
        grid-column: 1;
        grid-row: 2;
      }

      .direction-pad [data-game-key="arrowdown"] {
        grid-column: 2;
        grid-row: 2;
      }

      .direction-pad [data-game-key="arrowright"] {
        grid-column: 3;
        grid-row: 2;
      }

      .action-pad {
        display: grid;
        grid-template-columns: repeat(2, minmax(72px, 1fr));
        gap: 8px;
        flex: 1;
      }

      .touch-controls button {
        min-height: 48px;
        border: 1px solid #71808c;
        border-radius: 10px;
        background: #303d49;
        color: #f1eee7;
        font: bold 15px sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .touch-controls button:active {
        background: #8a6943;
        border-color: #f2c977;
      }

      .action-pad [data-game-key="e"] {
        grid-column: 1 / 3;
        min-height: 56px;
        background: #775e3b;
      }

      .action-pad [data-game-key="shift"] {
        background: #593f3b;
      }
    }

    @media (max-width: 600px) {
      .info-sidebar {
        grid-template-columns: 1fr;
      }

      .controls-info {
        padding: 12px 0 0;
        border-top: 1px solid #465361;
        border-left: 0;
      }
    }

    @media (max-width: 430px) {
      .touch-controls {
        gap: 8px;
        padding: 8px;
      }

      .direction-pad {
        grid-template-columns: repeat(3, 46px);
        grid-template-rows: repeat(2, 44px);
        gap: 4px;
      }

      .touch-controls button {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Don't Wake It</h1>

    <div class="game-layout">
      <canvas
        id="game"
        width="960"
        height="640"
        aria-label="The game area"
      ></canvas>

      <aside class="info-sidebar" aria-label="Raid information and controls">
        <section>
          <h2>Raid status</h2>
          <dl class="stats">
            <div><dt>Banked</dt><dd id="hud-banked">$0 / $80</dd></div>
            <div><dt>Time</dt><dd id="hud-timer">1:15</dd></div>
            <div><dt>Best success</dt><dd id="hud-best">$0</dd></div>
            <div><dt>Workshop bounty</dt><dd id="hud-wallet">$0</dd></div>
            <div><dt>Carrying</dt><dd id="hud-carrying">Nothing</dd></div>
          </dl>
          <p class="sidebar-message" id="hud-message" aria-live="polite"></p>
          <p class="sidebar-prompt" id="hud-prompt"></p>
        </section>

        <section class="controls-info">
          <h2>Controls</h2>
          <p><strong>Move:</strong> WASD or arrow keys</p>
          <p><strong>Sprint:</strong> hold Shift</p>
          <p><strong>Take / bank:</strong> hold E</p>
          <p><strong>Hide:</strong> H beside a crate</p>
          <p><strong>Workshop:</strong> click or tap an available part</p>
        </section>
      </aside>
    </div>

    <section class="touch-controls" aria-label="Touch game controls">
      <div class="direction-pad" aria-label="Movement controls">
        <button type="button" data-game-key="arrowup" aria-label="Move up">▲</button>
        <button type="button" data-game-key="arrowleft" aria-label="Move left">◀</button>
        <button type="button" data-game-key="arrowdown" aria-label="Move down">▼</button>
        <button type="button" data-game-key="arrowright" aria-label="Move right">▶</button>
      </div>

      <div class="action-pad" aria-label="Action controls">
        <button type="button" data-game-key="shift">SPRINT</button>
        <button type="button" data-game-key="h">HIDE</button>
        <button type="button" data-game-key="e">HOLD TO TAKE / BANK</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
